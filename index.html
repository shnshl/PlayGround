<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101c2c">
<link rel="icon" href="data:,">
<title>Neon Run — Subway Dash</title>
<style>
:root{color-scheme:dark;--cyan:#62f2ed;--gold:#ffcb64;--ink:#07111e;--glass:rgba(9,20,33,.72)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c2c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:white;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 22px) 28px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 14px #0008}
.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:42px;height:42px;border:1px solid #8ffff177;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#8efff333,#8efff30a);box-shadow:0 0 24px #59e4dc22;font-size:23px}.brandcopy{font-size:11px;letter-spacing:.24em;font-weight:800;color:#b8d5dc}.brandcopy strong{display:block;color:white;font-size:15px;letter-spacing:.11em;margin-top:3px}.stats{display:flex;gap:12px}.stat{min-width:105px;border:1px solid #d5faff26;border-radius:14px;padding:10px 15px;background:var(--glass);backdrop-filter:blur(12px)}.stat label{display:block;color:#9eb8c2;font-size:9px;font-weight:800;letter-spacing:.2em}.stat b{display:block;font-variant-numeric:tabular-nums;font-size:21px;line-height:1.2;margin-top:3px}.stat.score b{color:var(--gold)}.stat.coins b{color:var(--cyan)}
.bottom{display:flex;align-items:flex-end;justify-content:space-between}.hint{font-size:11px;color:#c5d4db;letter-spacing:.04em}.hint b{color:white}.keys{display:flex;gap:7px;margin-bottom:8px}.key{width:30px;height:28px;border:1px solid #d8faff4a;border-radius:7px;background:#0b1a2c9c;display:grid;place-items:center;font-size:12px;color:#e8ffff;box-shadow:0 2px 0 #0005}.sound{pointer-events:auto;background:var(--glass);border:1px solid #d5faff26;color:white;width:42px;height:42px;border-radius:13px;font-size:17px;cursor:pointer;margin-left:12px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#07111e1c,#07111e70);padding:22px;transition:opacity .25s,visibility .25s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.panel{width:min(490px,100%);border:1px solid #c8ffff30;border-radius:25px;padding:34px 38px 30px;background:linear-gradient(150deg,#12273beF,#091725ed);box-shadow:0 25px 100px #020711a6,0 0 70px #47e5da0b;backdrop-filter:blur(18px);text-align:center;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;inset:0 15% auto;height:1px;background:linear-gradient(90deg,transparent,#a4fff9aa,transparent)}.eyebrow{font-size:10px;letter-spacing:.28em;color:var(--cyan);font-weight:900}.panel h1{font-size:clamp(35px,8vw,54px);line-height:.98;letter-spacing:-.055em;margin:15px 0 12px}.panel h1 span{color:var(--gold)}.panel p{font-size:14px;line-height:1.65;color:#b6c8d1;margin:0 auto 22px;max-width:355px}.start{border:0;border-radius:12px;padding:15px 28px;background:linear-gradient(100deg,#74f5e8,#a5ffe9);font-weight:900;font-size:12px;letter-spacing:.17em;color:#09212b;cursor:pointer;box-shadow:0 7px 25px #63f4e533;min-width:190px;transition:transform .15s,filter .15s}.start:hover{transform:translateY(-2px);filter:brightness(1.08)}.controls{display:flex;justify-content:center;gap:22px;margin-top:22px;padding-top:18px;border-top:1px solid #ffffff14;color:#a8bdc7;font-size:10px}.controls b{display:block;color:#f1fbff;font-size:11px;margin-bottom:4px}.badge{display:inline-flex;align-items:center;gap:7px;margin-top:19px;color:#91a9b5;font-size:9px;letter-spacing:.14em}.dot{width:6px;height:6px;border-radius:50%;background:#7effd4;box-shadow:0 0 9px #7effd4}.mobile-controls{display:none;pointer-events:none;position:absolute;inset:auto 0 calc(env(safe-area-inset-bottom) + 14px);justify-content:space-between;padding:0 22px}.pad{display:flex;gap:9px}.touch{pointer-events:auto;border:1px solid #d6ffff55;background:#10223499;color:#eaffff;border-radius:15px;width:54px;height:51px;font-size:19px;backdrop-filter:blur(8px);box-shadow:0 4px 16px #0004;touch-action:none}.touch:active{background:#5ceadd66}.touch.action{width:64px;font-size:11px;font-weight:900;letter-spacing:.08em}.toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-12px);padding:10px 16px;background:#102b3bd9;border:1px solid #75fff055;border-radius:30px;color:#bafff7;font-size:11px;letter-spacing:.11em;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){#hud{padding:calc(env(safe-area-inset-top) + 14px) 15px calc(env(safe-area-inset-bottom) + 12px)}.brandmark{width:36px;height:36px}.brandcopy{font-size:8px}.brandcopy strong{font-size:12px}.stats{gap:7px}.stat{min-width:72px;padding:8px 10px;border-radius:11px}.stat label{font-size:8px}.stat b{font-size:17px}.hint,.keys{display:none}.mobile-controls{display:flex}.panel{padding:29px 23px 24px}.controls{gap:13px}.sound{width:37px;height:37px;margin-left:0}}
</style>
</head>
<body>
<canvas id="game" aria-label="Three lane subway runner game"></canvas>
<div id="hud">
  <div class="top">
    <div class="brand"><div class="brandmark">↗</div><div class="brandcopy">NIGHT SHIFT<strong>NEON RUN</strong></div></div>
    <div class="stats"><div class="stat score"><label>DISTANCE</label><b id="score">000000</b></div><div class="stat coins"><label>COINS</label><b id="coinCount">◉ 0</b></div><button id="sound" class="sound" aria-label="Toggle sound">♫</button></div>
  </div>
  <div class="bottom"><div class="hint">SWIPE OR <b>← →</b> CHANGE LANE <span style="color:#718c98">　·　</span><b>↑</b> JUMP <span style="color:#718c98">　·　</span><b>↓</b> SLIDE</div><div class="keys"><span class="key">←</span><span class="key">↑</span><span class="key">↓</span><span class="key">→</span></div></div>
</div>
<div id="toast" class="toast">NICE SAVE!</div>
<div id="overlay" class="overlay"><section class="panel"><div class="eyebrow" id="eyebrow">LAST TRAIN — NOW BOARDING</div><h1 id="title">RUN THE<br><span>NIGHT LINE</span></h1><p id="message">The city never sleeps. Dodge the trains, grab the glow, and see how far you can ride.</p><button id="start" class="start">START RUN&nbsp; ↗</button><div class="controls"><div><b>← →</b>SWITCH LANES</div><div><b>↑ / SPACE</b>JUMP</div><div><b>↓</b>SLIDE</div></div><div class="badge"><span class="dot"></span> THREE LANES. ONE WAY OUT.</div></section></div>
<div class="mobile-controls"><div class="pad"><button class="touch" data-action="left" aria-label="Move left">‹</button><button class="touch" data-action="right" aria-label="Move right">›</button></div><div class="pad"><button class="touch action" data-action="jump">JUMP</button><button class="touch action" data-action="slide">SLIDE</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={score:document.getElementById('score'),coins:document.getElementById('coinCount'),overlay:document.getElementById('overlay'),title:document.getElementById('title'),message:document.getElementById('message'),eyebrow:document.getElementById('eyebrow'),start:document.getElementById('start'),sound:document.getElementById('sound'),toast:document.getElementById('toast')};
let W=innerWidth,H=innerHeight,DPR=1,now=0,last=0,run=false,paused=false,dead=false,lane=1,playerLane=1,jump=0,slide=0,coins=0,distance=0,speed=18,spawnAt=0,entities=[],particles=[],buildings=[],soundOn=false,audio=null,best=+(localStorage.getItem('neonRunBest')||0);
const laneX=[-2.25,0,2.25],focal=760;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function project(x,y,z){const depth=Math.max(1,z+8);const f=Math.min(focal,H*1.25);return {x:W*.5+(x*f/depth),y:H*.29+((3.35-y)*f/depth),s:f/depth,depth}}
function poly(points,fill,stroke=null,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function line(a,b,color,width=1){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function box(x,y,z,w,h,d,colors){const a=project(x-w/2,y,z),b=project(x+w/2,y,z),c=project(x+w/2,y+h,z),e=project(x-w/2,y+h,z),a2=project(x-w/2,y,z+d),b2=project(x+w/2,y,z+d),c2=project(x+w/2,y+h,z+d),e2=project(x-w/2,y+h,z+d);poly([a,b,b2,a2],colors[0]);poly([b,c,c2,b2],colors[1]);poly([a,e,e2,a2],colors[2]);poly([e,c,e2],colors[3]||colors[2]);poly([e,c,c2,e2],colors[3]||colors[2]);return {a,b,c,e,a2,b2,c2,e2}}
function makeBuildings(){buildings=[];for(let side of [-1,1])for(let i=0;i<18;i++)buildings.push({side,z:i*8+rand(0,8),w:rand(2,5),h:rand(7,22),color:['#18293a','#1a2d3e','#203246','#172638'][Math.floor(rand(0,4))],seed:rand(0,99)});}
makeBuildings();
function sky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17263b');g.addColorStop(.42,'#456477');g.addColorStop(.72,'#e7a36f');g.addColorStop(1,'#d8875e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const sx=W*.77,sy=H*.25,rad=Math.min(W,H)*.07;let sun=ctx.createRadialGradient(sx,sy,rad*.15,sx,sy,rad*2.7);sun.addColorStop(0,'#fff0c8cc');sun.addColorStop(.25,'#ffc98277');sun.addColorStop(1,'#ffb46b00');ctx.fillStyle=sun;ctx.fillRect(sx-rad*3,sy-rad*3,rad*6,rad*6);ctx.fillStyle='#ffe2ad';ctx.beginPath();ctx.arc(sx,sy,rad*.55,0,Math.PI*2);ctx.fill();
// distant skyline
for(let i=0;i<15;i++){let x=i*W/13-W*.05,bh=H*(.07+(Math.sin(i*37)*.5+.5)*.11),bw=W/10;ctx.fillStyle=i%2?'#35465799':'#283a4b99';ctx.fillRect(x,H*.43-bh,bw,bh);ctx.fillStyle='#ffc98744';for(let yy=H*.43-bh+8;yy<H*.43-5;yy+=10)for(let xx=x+5;xx<x+bw-4;xx+=9)if(Math.sin(xx*yy+i)>0)ctx.fillRect(xx,yy,3,4);}
let ground=ctx.createLinearGradient(0,H*.46,0,H);ground.addColorStop(0,'#8e6454');ground.addColorStop(.25,'#4b4b50');ground.addColorStop(1,'#151c27');ctx.fillStyle=ground;ctx.fillRect(0,H*.45,W,H*.55);
}
function drawBuildings(dt){for(const b of buildings){b.z-=dt*speed*.42;if(b.z<-15)b.z+=144;const x=b.side*(5.2+b.w*.5),p=project(x,0,b.z),top=project(x,b.h,b.z),w=b.w*p.s;ctx.fillStyle=b.color;ctx.fillRect(p.x-w/2,top.y,w,p.y-top.y);let win=p.s*.09;ctx.fillStyle='#ffd38a55';for(let yy=top.y+win;yy<p.y-win;yy+=win*2.4)for(let xx=p.x-w*.36;xx<p.x+w*.36;xx+=win*2)if(Math.sin(xx*yy+b.seed)>-.25)ctx.fillRect(xx,yy,win*.55,win*.8);}}
function world(){sky();drawBuildings(.016);const horizon=H*.29;const edgeL=project(-4.1,0,0),edgeR=project(4.1,0,0),farL=project(-4.1,0,110),farR=project(4.1,0,110);poly([farL,farR,edgeR,edgeL],'#343a40');
// station platforms and track bed
const outerL=project(-5,0,0),outerR=project(5,0,0),outerFL=project(-5,0,110),outerFR=project(5,0,110);poly([outerFL,farL,edgeL,outerL],'#65584f');poly([farR,outerFR,outerR,edgeR],'#65584f');
// track lane fills
for(let i=0;i<3;i++){let cx=laneX[i];const l1=project(cx-1.08,0,0),r1=project(cx+1.08,0,0),l2=project(cx-1.08,0,110),r2=project(cx+1.08,0,110);poly([l2,r2,r1,l1],i===1?'#34383c':'#30363a');}
// sleepers
for(let z=2-(distance*.9%4);z<108;z+=4){let l=project(-3.45,0,z),r=project(3.45,0,z);line(l,r,'#9b795d88',Math.max(1,l.s*.12));}
// rails
for(let x of [-3.1,-1.4,-.85,.85,1.4,3.1]){let a=project(x,0,0),b=project(x,0,110);line(a,b,'#c3c4bd',Math.max(1,a.s*.075));line(project(x+.06,0,0),project(x+.06,0,110),'#42484b',Math.max(1,a.s*.04));}
// lane separators subtle
for(let x of [-1.125,1.125])line(project(x,.015,0),project(x,.015,105),'#b2d8d022',1);
// overhead station crossbars
for(let z=18-(distance*.55%22);z<100;z+=22){let l=project(-6,5,z),r=project(6,5,z);line(l,r,'#273b48',Math.max(2,l.s*.18));for(let x of [-5.7,5.7])line(project(x,0,z),project(x,5,z),'#314654',Math.max(2,l.s*.16));}
// platform edge lights
for(let z=0-(distance%5);z<100;z+=5)for(let x of [-4.3,4.3]){let p=project(x,.15,z);ctx.fillStyle='#ffcb74';ctx.shadowColor='#ffc778';ctx.shadowBlur=Math.min(14,p.s*.1);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.3,p.s*.055),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
}
function addObstacle(type,l,z){entities.push({kind:'obstacle',type,l,z,hit:false,phase:rand(0,8)});}
function addCoin(l,z,y=1){entities.push({kind:'coin',l,z,y,phase:rand(0,Math.PI*2),taken:false});}
function spawnWave(){let z=80;const r=Math.random();if(r<.28){const l=Math.floor(rand(0,3));addObstacle('train',l,z);addCoin((l+1+Math.floor(rand(0,2)))%3,z+5);for(let n=0;n<6;n++)addCoin((l+1)%3,z+10+n*3,.9+Math.sin(n*.6)*.25);}else if(r<.55){let l=Math.floor(rand(0,3));addObstacle('barrier',l,z);addCoin(l,z+11,1.3);addCoin(l,z+15,1.7);addCoin(l,z+19,1.3);}else if(r<.77){let l=Math.floor(rand(0,3));addObstacle('beam',l,z);for(let n=0;n<7;n++)addCoin(l,z+10+n*3,.72);}else{let safe=Math.floor(rand(0,3));for(let l=0;l<3;l++)if(l!==safe)addObstacle(Math.random()<.48?'barrier':'train',l,z+rand(-2,2));for(let n=0;n<8;n++)addCoin(safe,z+3+n*3,.95+Math.sin(n*.5)*.23);}
spawnAt=distance+rand(39,53);}
function drawCoin(e){let p=project(laneX[e.l],e.y+Math.sin(now*5+e.phase)*.08,e.z);let r=Math.max(2,p.s*.19),spin=Math.abs(Math.cos(now*3+e.phase));ctx.save();ctx.translate(p.x,p.y);ctx.scale(Math.max(.14,spin),1);ctx.shadowColor='#ffe28a';ctx.shadowBlur=Math.min(20,r*1.25);ctx.fillStyle='#ffd46d';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.lineWidth=Math.max(1,r*.14);ctx.strokeStyle='#fff0bb';ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#c98532';ctx.font=`900 ${Math.max(4,r*1.1)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('N',0,1);ctx.restore();}
function drawObstacle(e){const x=laneX[e.l],z=e.z;if(e.type==='train'){
const q=box(x,0,z,1.85,3.8,7,['#236b78','#163c50','#102c3e','#24818a']);let w=q.c.x-q.b.x,h=q.b.y-q.c.y;const topY=q.c.y;for(let i=0;i<3;i++){let wx=q.b.x+w*(.13+i*.28),wy=topY+h*.3;ctx.fillStyle='#a5e8dc';ctx.fillRect(wx,wy,w*.19,h*.22);ctx.fillStyle='#ffca79';ctx.fillRect(wx,wy+h*.22,w*.19,Math.max(1,h*.025));}ctx.fillStyle='#0a2634';ctx.fillRect(q.a.x+(q.b.x-q.a.x)*.18,q.a.y-h*.22,w*.64,h*.23);line(q.e,q.c,'#50c0bd',Math.max(1,q.c.s*.06));
}else if(e.type==='barrier'){
box(x,0,z,1.95,.95,.7,['#d78344','#a65335','#904b33','#f2a253']);const p=project(x,0,z),top=project(x,.95,z);for(let n=-1;n<=1;n++){let px=p.x+n*p.s*.42;line({x:px,y:p.y},{x:px+n*p.s*.32,y:top.y},'#ffe0a6',Math.max(1,p.s*.07));}let glow=project(x,.52,z-.08);ctx.fillStyle='#ffbd68';ctx.shadowColor='#ff913a';ctx.shadowBlur=glow.s*.12;ctx.fillRect(glow.x-glow.s*.55,glow.y-glow.s*.045,glow.s*1.1,glow.s*.09);ctx.shadowBlur=0;
}else{
const q=box(x,0,z,2.1,1.2,.75,['#673a70','#412b5c','#2d274d','#9262a0']);const b=project(x-1.05,1.2,z),c=project(x+1.05,1.2,z);line(b,c,'#ffa6d7',Math.max(2,b.s*.1));for(let n=-1;n<=1;n++){let p=project(x+n*.58,.6,z-.06);ctx.fillStyle='#ff8fc9';ctx.shadowColor='#ff64b5';ctx.shadowBlur=p.s*.09;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2,p.s*.08),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}}
}
function drawPlayer(){const lower=Math.max(0,Math.min(2,Math.floor(playerLane)));let x=laneX[lower];if(lower<2)x+=(laneX[lower+1]-x)*(playerLane-lower);
let bob=run&&!dead?Math.sin(now*14)*.07:0, lift=jump>0?Math.sin((1-jump/0.82)*Math.PI)*1.45:0, crouch=slide>0?.48:0,p=project(x,0,0),scale=p.s;ctx.save();ctx.translate(p.x,p.y-lift*scale);ctx.scale(scale,scale);ctx.globalAlpha=.35;ctx.fillStyle='#06101b';ctx.beginPath();ctx.ellipse(0,0,1.05,.2,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// legs stride
let stride=run&&!dead?Math.sin(now*14)*.3:0;ctx.lineCap='round';ctx.lineWidth=.27;ctx.strokeStyle='#142d42';ctx.beginPath();ctx.moveTo(-.22,-1.15+crouch);ctx.lineTo(-.34+stride,-.48+crouch);ctx.lineTo(-.51+stride,-.1);ctx.stroke();ctx.beginPath();ctx.moveTo(.22,-1.15+crouch);ctx.lineTo(.34-stride,-.47+crouch);ctx.lineTo(.48-stride,-.1);ctx.stroke();ctx.fillStyle='#ffcb75';ctx.beginPath();ctx.ellipse(-.53+stride,-.07,.27,.12,-.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(.5-stride,-.07,.27,.12,-.1,0,Math.PI*2);ctx.fill();
// jacket and arms
let bodyTop=-2.03+crouch,bodyBottom=-1.05+crouch;ctx.fillStyle='#ff7e54';ctx.beginPath();ctx.moveTo(-.32,bodyTop+.12);ctx.lineTo(.28,bodyTop+.12);ctx.lineTo(.42,bodyBottom);ctx.lineTo(-.42,bodyBottom);ctx.closePath();ctx.fill();ctx.fillStyle='#f8b25e';ctx.fillRect(-.06,bodyTop+.12,.12,bodyBottom-bodyTop-.12);ctx.strokeStyle='#e99b58';ctx.lineWidth=.2;ctx.beginPath();ctx.moveTo(-.31,bodyTop+.25);ctx.lineTo(-.57+stride,-1.42+crouch);ctx.lineTo(-.52+stride,-1.08);ctx.stroke();ctx.beginPath();ctx.moveTo(.31,bodyTop+.25);ctx.lineTo(.57-stride,-1.55+crouch);ctx.lineTo(.55-stride,-1.2);ctx.stroke();
// head, cap and visor
ctx.fillStyle='#c87955';ctx.beginPath();ctx.arc(0,bodyTop-.25,.29,0,Math.PI*2);ctx.fill();ctx.fillStyle='#234d61';ctx.beginPath();ctx.arc(-.02,bodyTop-.31,.31,Math.PI,Math.PI*2);ctx.lineTo(.29,bodyTop-.28);ctx.lineTo(-.32,bodyTop-.28);ctx.fill();ctx.fillStyle='#79f5e1';ctx.fillRect(.08,bodyTop-.33,.2,.08);ctx.restore();}
function sparkle(p){for(let i=0;i<9;i++)particles.push({x:p.x,y:p.y,vx:rand(-90,90),vy:rand(-130,55),life:.55,color:i%2?'#fff1a8':'#72fff0'});}
function updateEntities(dt){for(const e of entities)e.z-=speed*dt;entities=entities.filter(e=>e.z>-14&&!(e.kind==='coin'&&e.taken));for(const e of entities){if(e.l!==Math.round(playerLane))continue;if(e.kind==='coin'&&Math.abs(e.z)<1.9&&!e.taken){e.taken=true;coins++;ui.coins.textContent='◉ '+coins;let p=project(laneX[e.l],e.y,e.z);sparkle(p);if(soundOn)beep(740,.06);}else if(e.kind==='obstacle'&&!e.hit&&Math.abs(e.z)<1.25){let safe=(e.type==='barrier'&&jump>.2)||(e.type==='beam'&&slide>.15);if(!safe){e.hit=true;endRun();}else if(!e.hit){e.hit=true;toast('CLEAN DODGE');}}}}
function toast(s){ui.toast.textContent=s;ui.toast.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>ui.toast.classList.remove('show'),900);}
function beep(freq,duration){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;osc.type='sine';gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration);}catch{}}
function action(a){if(!run||paused)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&jump<=0&&slide<=0){jump=.82;if(soundOn)beep(480,.08);}if(a==='slide'&&jump<=0){slide=.72;if(soundOn)beep(260,.07);}}
function startRun(){entities=[];particles=[];distance=0;coins=0;speed=18;lane=1;playerLane=1;jump=slide=0;spawnAt=25;run=true;paused=false;dead=false;ui.coins.textContent='◉ 0';ui.score.textContent='000000';ui.overlay.classList.add('hidden');last=performance.now();}
function endRun(){if(dead)return;run=false;dead=true;best=Math.max(best,Math.floor(distance));localStorage.setItem('neonRunBest',best);ui.eyebrow.textContent='RUN COMPLETE  ·  BEST '+String(best).padStart(6,'0');ui.title.innerHTML='ONE MORE<br><span>RUN?</span>';ui.message.innerHTML=`You made it <b style="color:#ffcb64">${Math.floor(distance)} m</b> and collected <b style="color:#62f2ed">${coins} coins</b>. The night line is still moving.`;ui.start.textContent='RUN IT BACK  ↗';setTimeout(()=>ui.overlay.classList.remove('hidden'),420);}
function drawParticles(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/.55);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3);}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);}
function drawVignette(){let g=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.18,W/2,H*.48,Math.max(W,H)*.74);g.addColorStop(0,'#020a1400');g.addColorStop(1,'#020a1455');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function frame(t){requestAnimationFrame(frame);let dt=Math.min(.04,(t-last)/1000||0);last=t;now=t/1000;if(run&&!paused){distance+=speed*dt;speed=Math.min(31,18+distance*.013);if(distance>=spawnAt)spawnWave();playerLane+=(lane-playerLane)*Math.min(1,dt*13);jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);updateEntities(dt);ui.score.textContent=String(Math.floor(distance*10)).padStart(6,'0');}
world();entities.sort((a,b)=>b.z-a.z);for(const e of entities){if(e.kind==='coin')drawCoin(e);else drawObstacle(e);}drawPlayer();drawParticles(dt);drawVignette();}
requestAnimationFrame(frame);
ui.start.addEventListener('click',()=>{if(paused){paused=false;ui.overlay.classList.add('hidden');last=performance.now();}else startRun();});
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();if(paused){if(k==='escape'||k==='p'||k==='enter'){paused=false;ui.overlay.classList.add('hidden');last=performance.now();}return;}if(!run){if(k==='enter'||k===' ')startRun();return;}if(k==='escape'||k==='p'){paused=true;ui.eyebrow.textContent='PAUSED';ui.title.innerHTML='CATCH YOUR<br><span>BREATH</span>';ui.message.textContent='The night line can wait. Take a moment, then jump back in.';ui.start.textContent='RESUME RUN  ↗';ui.overlay.classList.remove('hidden');return;}if(k==='arrowleft'||k==='a')action('left');if(k==='arrowright'||k==='d')action('right');if(k==='arrowup'||k==='w'||k===' ')action('jump');if(k==='arrowdown'||k==='s')action('slide');});
document.querySelectorAll('.touch').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();action(b.dataset.action);});});
let touchStart=null;canvas.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY};});canvas.addEventListener('pointerup',e=>{if(!touchStart)return;let dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>26){if(Math.abs(dx)>Math.abs(dy))action(dx<0?'left':'right');else action(dy<0?'jump':'slide');}touchStart=null;});
ui.sound.addEventListener('click',()=>{soundOn=!soundOn;ui.sound.textContent=soundOn?'♫':'♪';ui.sound.style.color=soundOn?'#62f2ed':'white';if(soundOn)beep(560,.07);});
})();
</script>
